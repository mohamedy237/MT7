<style>
:root{--ink:#10343f;--teal:#0e7c86;--teal2:#e3f2f3;--gold:#c8962b;--bg:#f3f6f7;--line:#d6e0e3;--red:#b3362f;--green:#1f7a4d;--r:10px}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:.55em 1em;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
button.pri{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ok.on{background:var(--green);border-color:var(--green)}
button.no.on{background:var(--red);border-color:var(--red)}
input,select{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:.55em .8em;min-height:44px;background:#fff}
.top{background:var(--ink);color:#fff;padding:.8em 1.2em;display:flex;align-items:center;gap:1em;justify-content:space-between}
.top b{font-size:1.1em}.top button{background:transparent;color:#fff;border-color:#ffffff55;min-height:36px}
main{max-width:960px;margin:0 auto;padding:1.2em}
h2{margin:.2em 0 .8em;font-size:1.3em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.9em}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1em}
.card.btn{text-align:start;display:block;width:100%}
.big{font-size:1.5em;font-weight:700}
.muted{color:#5d7780;font-size:.88em}
.bar{height:8px;border-radius:5px;background:var(--teal2);overflow:hidden;margin:.6em 0 .3em}
.bar i{display:block;height:100%;background:var(--teal)}
.row{display:flex;align-items:center;gap:.7em;padding:.7em 1em;border-bottom:1px solid var(--line);cursor:pointer;background:#fff;width:100%;text-align:start;border-radius:0;min-height:56px}
.list{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:.8em}
.row .n{width:2.2em;color:#5d7780}.row .nm{flex:1;font-weight:600}
.chip{padding:.15em .7em;border-radius:20px;font-size:.85em;background:var(--teal2);white-space:nowrap}
.chip.a{background:#f8e0de;color:var(--red)}.chip.c{background:#dcf1e6;color:var(--green)}
.bar2{display:flex;gap:.7em;flex-wrap:wrap}.bar2>*{flex:1;min-width:130px}
.seg{display:flex;gap:.5em;margin:.6em 0}.seg>button{flex:1}
.modal{position:fixed;inset:0;background:#10343f99;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:1.2em}
@media(min-width:640px){.modal{align-items:center}.sheet{border-radius:18px}}
.st{min-height:1.6em;font-weight:600;margin:.4em 0}.st.bad{color:var(--red)}.st.good{color:var(--green)}
.sum{background:var(--teal2);border-radius:var(--r);padding:.7em 1em;margin:.8em 0;line-height:1.9}
hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.login{max-width:380px;margin:12vh auto;padding:1.5em}.login h1{margin:0 0 .2em}
label{display:block;margin:.7em 0 .25em;font-weight:600}
.pw{position:relative}.pw input{padding-right:5.2em;padding-left:.7em}.pw button{position:absolute;inset-inline-end:auto;left:auto;right:4px;top:4px;min-height:36px;padding:.2em .7em;background:#eef3f5;border:1px solid #ccd}
.err{color:var(--red);min-height:1.5em;margin-top:.6em}
a.back{background:none;border:0;padding:0;color:var(--teal);font-weight:600;min-height:auto;margin-bottom:.6em}

/* ===== institutional theme ===== */
:root{--ink:#0b2c4a;--teal:#12a5b5;--teal2:#e2f5f7;--gold:#e8a900;--gold2:#ffd54a;--red:#e2231a;--green:#2f9e44;--bg:#f4f8fb;--line:#d5e3ea}
body{background:linear-gradient(180deg,#eaf4f8 0,#f7fafc 240px,#f4f8fb 100%) fixed}
body::after{content:"";position:fixed;inset:auto auto 4vh 3vw;width:min(46vmin,420px);aspect-ratio:1;background:var(--logo) center/contain no-repeat;opacity:.045;pointer-events:none;z-index:0}
main,.top{position:relative;z-index:1}
.top{position:sticky;top:0;z-index:6;background:linear-gradient(110deg,#0b2c4a 0,#0f5c78 60%,#12a5b5 100%);border-bottom:3px solid var(--gold);box-shadow:0 4px 18px #0b2c4a40}
.top::after{content:"";position:absolute;inset:auto 0 -3px 0;height:3px;background:linear-gradient(90deg,transparent,#fff9,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 4s linear infinite}
.brand{display:flex;align-items:center;gap:.8em}
.lg{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold),0 0 0 6px #ffffff22;animation:glow 3.2s ease-in-out infinite}
.top b{letter-spacing:.2px}
.top button{border-color:#ffffff66;transition:.2s}.top button:hover{background:#ffffff26;transform:translateY(-1px)}
button{transition:transform .15s,box-shadow .2s,background .2s}
button:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 12px #0b2c4a22}
button:active{transform:scale(.98)}
button.pri{background:linear-gradient(135deg,#12a5b5,#0f7f99);border:0;color:#fff;box-shadow:0 3px 10px #12a5b555;position:relative;overflow:hidden}
button.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff55 50%,transparent 65%);transform:translateX(-120%)}
button.pri:hover::after{transform:translateX(120%);transition:transform .7s}
button.on{background:linear-gradient(135deg,#0b2c4a,#0f5c78)}
.card{border:1px solid var(--line);border-top:3px solid transparent;box-shadow:0 2px 10px #0b2c4a0f;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .5s both}
.card.btn:hover{transform:translateY(-4px);box-shadow:0 10px 24px #0b2c4a26;border-top-color:var(--gold)}
.grid>*:nth-child(2){animation-delay:.05s}.grid>*:nth-child(3){animation-delay:.1s}.grid>*:nth-child(4){animation-delay:.15s}.grid>*:nth-child(n+5){animation-delay:.2s}
.big{background:linear-gradient(90deg,#0b2c4a,#12a5b5);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{position:relative;padding-inline-start:.7em}h2::before{content:"";position:absolute;inset-inline-start:0;top:.15em;bottom:.15em;width:5px;border-radius:4px;background:linear-gradient(var(--gold),var(--teal))}
.bar{background:#dcecf0}.bar i{background:linear-gradient(90deg,var(--teal),var(--gold));animation:fill 1s ease-out both}
.row{animation:rise .35s both;transition:background .15s,padding .15s}.row:hover{background:var(--teal2);padding-inline-start:1.3em}
.list{box-shadow:0 2px 10px #0b2c4a0f}
.chip{font-weight:600}.sum{background:linear-gradient(135deg,#e2f5f7,#fff7dc);border:1px solid #f1e2a8}
.modal{animation:fade .2s both;backdrop-filter:blur(3px)}.sheet{animation:up .3s cubic-bezier(.2,.9,.3,1) both;border-top:4px solid var(--gold)}
.sheet::before{content:"";display:block;width:100%;height:0}
table th{background:linear-gradient(135deg,#0b2c4a,#0f5c78)!important;color:#fff;border-color:#0b2c4a!important}
table tr:nth-child(even) td{background:#f3f9fb}table tr:hover td{background:#fff6d6}
.tw{border-radius:var(--r);box-shadow:0 2px 10px #0b2c4a0f}
.phd{display:none}
/* login */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(135deg,#0b2c4a,#0f5c78 55%,#12a5b5);display:grid;place-items:center;padding:1em}
.blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 14s ease-in-out infinite}
.b1{width:340px;height:340px;background:#e8a900;top:-80px;right:-60px}.b2{width:300px;height:300px;background:#e2231a;bottom:-90px;left:-70px;opacity:.35;animation-delay:-5s}.b3{width:260px;height:260px;background:#8dc63f;top:40%;left:55%;opacity:.3;animation-delay:-9s}
.stage .login{position:relative;z-index:1;margin:0;width:100%;max-width:400px;padding:1.6em 1.5em;background:#ffffffeb;backdrop-filter:blur(10px);border:0;border-top:4px solid var(--gold);border-radius:20px;box-shadow:0 24px 60px #00000055;text-align:center;animation:rise .7s both}
.stage .login label{text-align:start}
.ring{width:128px;height:128px;margin:-70px auto .6em;border-radius:50%;padding:5px;background:conic-gradient(var(--gold),var(--teal),var(--red),var(--gold));animation:spin 8s linear infinite;box-shadow:0 8px 24px #0b2c4a55}
.ring img{width:100%;height:100%;border-radius:50%;background:#fff;display:block;animation:spin 8s linear infinite reverse}
.stage h1{font-size:1.35em;color:var(--ink)}.inst{font-size:.9em;color:#2b5870;font-weight:600;line-height:1.5}
.ecg{width:100%;height:34px;margin:.3em 0}.ecg path{fill:none;stroke:var(--red);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;animation:ecg 2.6s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fill{from{width:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 0 2px var(--gold),0 0 0 9px #ffd54a44}}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
@keyframes drift{50%{transform:translate(40px,30px) scale(1.12)}}
@keyframes ecg{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
@media(max-width:520px){.top{padding:.6em .8em}.brand .muted{display:none}.lg{width:38px;height:38px}}
@media print{body::after,.top{display:none!important}.phd{display:flex!important;align-items:center;gap:1em;border-bottom:3px solid #e8a900;padding-bottom:.5em;margin-bottom:.8em}.phd img{width:70px;height:70px}.phd b{font-size:15px}table th{background:#0b2c4a!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ecg path{stroke-dashoffset:0}}
</style>
<style>#syncbar{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}main{padding-bottom:5.5em}.bar2{align-items:flex-end}.bar2+button{margin-top:.7em}.grid.kpi{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}body{overflow-x:clip}.seg.tabs{flex-wrap:wrap}.seg.tabs>button{flex:1 1 auto;min-width:0;padding:.5em .7em}.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}table{border-collapse:collapse;width:100%;font-size:.9em}th,td{border:1px solid #ccd;padding:.4em .6em;text-align:right;white-space:nowrap}th{background:#e8f0f2;position:sticky;top:0}
@media print{.top,.seg,.bar2,#fq,button,.muted{display:none!important}body{background:#fff}table{font-size:10px}thead{display:table-header-group}tr{page-break-inside:avoid}@page{size:landscape;margin:10mm}}.gp{display:flex;flex-wrap:wrap;gap:.4em;max-height:220px;overflow:auto;border:1px solid #ccd;padding:.5em;border-radius:6px}.gc{display:flex;align-items:center;gap:.3em;margin:0;padding:.2em .5em;border:1px solid #dde;border-radius:6px;cursor:pointer}.gc input{width:auto;min-height:auto}</style>

const ACADEMIC_YEAR_OVERRIDE = null;
const academicYear = () => { if (ACADEMIC_YEAR_OVERRIDE) return ACADEMIC_YEAR_OVERRIDE; const d=new Date(), y=d.getFullYear(), s=d.getMonth()>=8?y:y-1; return s+' /'+(s+1); };
const $ = s => document.querySelector(s), app = $('#app');
const e = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TN = {antenatal:'Antenatal',labor:'Labor',postnatal:'Postnatal',lab:'Lab'};
const nat = (a,b) => a.localeCompare(b,undefined,{numeric:true});
const S = {sn:1, wk:1}; let M = {};
const num = k => Number(S.cfg[k]);
const tr = m => /coordinator approval/.test(m) ? 'الطالب غـ في كل الجلسات: يلزم أمر المنسق أولاً'
  : /exceeds|check constraint/.test(m) ? 'القيمة خارج الحد المسموح' : /duplicate/.test(m) ? 'السجل موجود بالفعل' : m;

/* ---------- auth ---------- */
function loginView(msg=''){
  app.innerHTML = `<div class="stage"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><form class="card login" id="lf"><div class="ring"><img src="${LOGO}" alt="شعار المعهد الفني للتمريض"></div><div class="inst">المعهد الفني للتمريض<br>كلية التمريض - جامعة المنصورة</div><svg class="ecg" viewBox="0 0 260 34" aria-hidden="true"><path pathLength="100" d="M0 18h70l8-10 10 22 10-28 10 22 8-6h144"/></svg><h1>نظام تقييم التدريب العملي</h1><div class="muted">سجّل الدخول بحسابك</div>
  <label for="em">الاسم</label><input id="em" type="text" autocomplete="username" required>
  <label for="pw">كلمة المرور</label><div class="pw"><input id="pw" type="password" autocomplete="current-password" required dir="ltr"><button type="button" id="sh">إظهار</button></div>
  <div class="err" id="er">${e(msg)}</div><button class="pri" style="width:100%">تسجيل الدخول</button></form></div>`;
  $('#sh').onclick = () => { const p=$('#pw'); const h=p.type==='password'; p.type=h?'text':'password'; $('#sh').textContent=h?'إخفاء':'إظهار'; };
  $('#lf').onsubmit = async ev => {
    ev.preventDefault(); $('#er').textContent='جارٍ الدخول...';
    const id=$('#em').value.trim(), pw=$('#pw').value;
    // MT7: تسجيل مباشر ببريد Auth (إن وُجد @) أو عبر Edge Function name-login إن كانت مرفوعة
    if (id.includes('@')) {
      const {error} = await SB.auth.signInWithPassword({email:id, password:pw});
      if (error) return $('#er').textContent = error.message||'البريد أو كلمة المرور غير صحيحة';
      return boot();
    }
    let j={}; try{ const r=await fetch(SB_URL+'/functions/v1/name-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_KEY},body:JSON.stringify({name:id,password:pw})}); j=await r.json(); }catch(x){ j={error:'تعذر الاتصال — جرّب الدخول بالبريد الإلكتروني'}; }
    if (!j.ok) return $('#er').textContent = j.error||'الاسم أو كلمة المرور غير صحيحة';
    const {error} = await SB.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});
    if (error) $('#er').textContent='فشل تسجيل الدخول'; else boot();
  };
}
const shell = (inner, sub='') => `<div class="top"><div class="brand"><img class="lg" src="${LOGO}" alt="شعار المعهد الفني للتمريض"><div><b>${e(S.me.full_name)}</b><div class="muted" style="color:#cfe6ec">${sub||INST}</div></div></div><div style="display:flex;gap:.4em"><button onclick="goHome()">الرئيسية</button><button onclick="logout()">خروج</button></div></div><main><div class="phd"><img src="${LOGO}" alt=""><div><b>${INST}</b><div>تقييم التدريب العملي - تمريض الأمومة</div><div>${new Date().toLocaleDateString('ar-EG')}</div></div></div>${inner}</main>`;
function goHome(){ $('#md')?.remove(); S.me.role==='doctor'?home():staffView(S.tab||'sum'); }
async function logout(){ await SB.auth.signOut(); S.me=null; loginView(); }

async function boot(){
  const user=await offUser();
  if(!user) return loginView('سجّل الدخول وأنت متصل بالإنترنت مرة واحدة على الأقل.');
  S.uid=user.id;
  const [d,a,st,p] = await Promise.all([
    SB.from('doctors').select('*').eq('user_id',user.id).maybeSingle(),
    SB.from('doctor_group_assignments').select('group_code,training_type_code'),
    SB.from('assessment_settings').select('key,value'),
    SB.from('training_periods').select('*').eq('is_open',true).order('id').limit(1)]);
  if(!d.data && d.error && isNet(d.error.message)) return loginView('لا توجد بيانات حساب محفوظة على هذا الجهاز. اتصل بالإنترنت وافتح النظام مرة واحدة ثم جهّز بيانات العمل دون إنترنت.');
  if (!d.data || !d.data.active){ await SB.auth.signOut(); return loginView('الحساب غير مفعّل. تواصل مع مدير النظام.'); }
  S.me=d.data; S.assign=a.data||[]; S.period=(p.data||[])[0];
  S.cfg=Object.fromEntries((st.data||[]).map(x=>[x.key,x.value]));
  if (S.me.role!=='doctor'){ staffView('sum'); await bar(); sync(); return; }

/* ---------- saving (never reports success before the DB confirms) ---------- */
const isNet=m=>!navigator.onLine||/failed to fetch|networkerror|load failed|network request|timeout|fetch|connection/i.test(String(m||''));
const withTO=(p,ms=15000)=>Promise.race([p,new Promise(r=>setTimeout(()=>r({error:{message:'timeout'}}),ms))]);
async function ensureSession(){
  if(S.g.sess){ S.ps=null; return S.g.sess; }
  const lab=S.t==='lab';
  if(S.ps){const same=S.ps.group_code===S.g.gc&&S.ps.period_id===S.period.id&&S.ps.session_no===S.sn&&(lab?!S.ps.training_type_code:S.ps.training_type_code===S.t);if(same)return {id:null,_pending:true};S.ps=null;}
  const row={group_code:S.g.gc,period_id:S.period.id,week_no:S.wk,session_no:S.sn,doctor_id:S.me.user_id,session_date:new Date().toLocaleDateString('en-CA')};
  if(!lab) row.training_type_code=S.t;
  if(!navigator.onLine){ S.ps=row; return {id:null,_pending:true}; }
  const r=await withTO(SB.from(lab?'lab_sessions':'clinical_sessions').insert(row).select().single());
  if(r.error){ if(isNet(r.error.message)){ S.ps=row; return {id:null,_pending:true}; }
    msg('فشل الحفظ: '+tr(r.error.message),'bad'); return null; }
  S.ps=null; S.g.sess=r.data; S.g.sessions.push(r.data); return r.data;
}
async function write(table,ex,row,key,store){
  if(S.busy) return false; S.busy=true;
  try{
    msg('جارٍ الحفظ...');
    const ps=(table==='clinical_assessments'||table==='lab_assessments')?S.ps:null;
    const ctx=[table,ex?.student_code||row.student_code,ex?.session_id||row.session_id||(ps?[S.g.gc,S.t,S.sn].join(':'):''),ex?.quiz_no||row.quiz_no||'',ex?.period_id||row.period_id||'',ex?.training_type_code||row.training_type_code||''].join('|');
    if((ex&&ex._pending)||(ps&&!ex)||!navigator.onLine) return await queueOp(ctx,table,ex,row,ps,store);
    const r=ex?await withTO(SB.from(table).update(row).eq('id',ex.id).eq('version',ex.version).select()):await withTO(SB.from(table).insert(row).select());
    if(r.error){ if(isNet(r.error.message)) return await queueOp(ctx,table,ex,row,ps,store);
      msg('فشل الحفظ: '+tr(r.error.message)+' - البيانات المدخلة ما زالت أمامك','bad'); return false; }
    if(!r.data||!r.data.length){ msg('تم تعديل هذا السجل من مستخدم آخر. أغلق البطاقة وافتحها من جديد.','bad'); return false; }
    store(r.data[0]); await loadSummary(); drawStu(); msg('تم الحفظ على الخادم بنجاح','good'); return true;
  }catch(er){
    if(isNet(er?.message)) return await queueOp([table,ex?.student_code||row.student_code,ex?.session_id||row.session_id||'',ex?.quiz_no||row.quiz_no||'',ex?.period_id||row.period_id||'',ex?.training_type_code||row.training_type_code||''].join('|'),table,ex,row,(table==='clinical_assessments'||table==='lab_assessments')?S.ps:null,store);
    msg('فشل الحفظ: '+(er?.message||er)+' - البيانات المدخلة ما زالت أمامك','bad'); return false;
  }finally{ S.busy=false; }
}
async function saveC(){
  if(!M.st) return msg('اختر حاضر أو غائب','bad');
  if(M.st==='present' && M.bg===null) return msg('اختر السلوك','bad');
  const sess=await ensureSession(); if(!sess) return; const pr=M.st==='present';
  const row={status:M.st, attendance_score:pr?num('clinical.attendance_max'):null, behavior_good:pr?M.bg:null,
             behavior_score:pr?(M.bg?num('clinical.behavior_max'):0):null, makeup_done:!pr&&!!S.g.ass[M.code]?.makeup_done, makeup_date:pr?null:(S.g.ass[M.code]?.makeup_date||null)};
  const ex=S.g.ass[M.code];
  await write('clinical_assessments',ex,ex?row:{...row,session_id:sess.id,student_code:M.code},0,x=>{S.g.ass[M.code]=x;S.g.all[M.code+'|'+S.sn]=x;});
}
async function saveSheet(){
  const v=parseFloat(M.sheet), mx=num('clinical.sheet_max');
  if(isNaN(v)||v<0||v>mx) return msg(`الدرجة يجب أن تكون بين 0 و ${mx}`,'bad');
  const ex=S.g.sheet[M.code];
  await write('clinical_sheet_scores',ex,ex?{score:v}:{student_code:M.code,training_type_code:S.t,period_id:S.period.id,score:v},0,x=>S.g.sheet[M.code]=x);
}
async function saveL(){
  if(!M.st) return msg('اختر حاضر أو غائب','bad');
  const pr=M.st==='present', a=parseFloat(M.att), p=parseFloat(M.part);
  if(pr){ if(isNaN(a)||a<0||a>num('lab.attendance_max')) return msg('درجة الحضور غير صحيحة','bad');
          if(isNaN(p)||p<0||p>num('lab.participation_max')) return msg('درجة المشاركة غير صحيحة','bad'); }
  const sess=await ensureSession(); if(!sess) return;
  const row={status:M.st, attendance_score:pr?a:null, participation_score:pr?p:null}, ex=S.g.ass[M.code];
  await write('lab_assessments',ex,ex?row:{...row,session_id:sess.id,student_code:M.code},0,x=>S.g.ass[M.code]=x);
}
async function saveQ(){
  for(const n of [1,2]){
    const raw=M['q'+n]; if(raw===''||raw==null) continue;
    const v=parseFloat(raw), mx=num('lab.quiz'+n+'_max');
    if(isNaN(v)||v<0||v>mx) return msg(`Quiz ${n}: الدرجة بين 0 و ${mx}`,'bad');
    const ex=S.g.quiz[M.code+'|'+n];
    if(!await write('lab_quizzes',ex,ex?{score:v}:{student_code:M.code,period_id:S.period.id,quiz_no:n,score:v},0,x=>S.g.quiz[M.code+'|'+n]=x)) return;
  }
}

async function staffView(tab){

    if(!window.ExcelJS) await loadJs('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
    const {grp,stu,cl,lb,gt}=S.st, wb=new ExcelJS.Workbook();
    const LOGOPNG=await new Promise(ok=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(im,0,0,128,128);ok(c.toDataURL('image/png'));};im.onerror=()=>ok(null);im.src=LOGO;});
    const C={},L={},G={}; cl.forEach(r=>C[r.student_code+'|'+r.training_type_code]=r); lb.forEach(r=>L[r.student_code]=r); gt.forEach(r=>G[r.student_code]=r);
    const v=x=>x==null||x===''?null:(isNaN(Number(x))?x:Number(x));
    const codes=(S.f&&S.f.g)?[S.f.g]:grp.map(g=>g.code);
    const thin={style:'thin'}, bd={top:thin,left:thin,bottom:thin,right:thin}, ctr={horizontal:'center',vertical:'middle',wrapText:true};
    const fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9E2F3'}};
    for(const code of codes){
      const ws=wb.addWorksheet(code,{pageSetup:{orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:0,printTitlesRow:'3:4',horizontalCentered:true,margins:{left:.25,right:.25,top:.5,bottom:.5,header:.3,footer:.3}}});
      ws.columns=Array.from({length:17},(_,i)=>({width:i===0?9:i===15?50:i===16?5:6}));
      ws.mergeCells('B1:Q1'); ws.mergeCells('A2:Q2');
      ['A3:A4','B3:F3','G3:I3','J3:L3','M3:O3','P3:P4','Q3:Q4'].forEach(r=>ws.mergeCells(r));
      Object.assign(ws.getCell('B1'),{value:'Evaluation for second year students in clinical obstetric nursing for academic year '+academicYear()});
      ws.getCell('B1').font={name:'Times New Roman',size:13,bold:true,color:{argb:'FF7F7F7F'}}; ws.getCell('B1').alignment=ctr;
      ws.getCell('A2').value=code; ws.getCell('A2').font={name:'Arial',size:14,bold:true}; ws.getCell('A2').alignment=ctr;
      const h3={A3:'Total (90)',B3:'Lab',G3:'Labour',J3:'Post',M3:'Ante',P3:'Names',Q3:'م'};
      const h4=['Total (30)','Quiz2 (10)','Quiz1 (10)','Participation (5)','Absent (5)','Total (20)','Sheet (15)','Absent (5)','Total (20)','Sheet (15)','Absent (5)','Total (20)','Sheet (15)','Absent (5)'];
      for(let c=1;c<=17;c++){ for(const r of [3,4]){const x=ws.getCell(r,c);x.border=bd;x.alignment=ctr;x.font={name:'Arial',size:r===3?12:11,bold:true};} }
      for(const k in h3){ws.getCell(k).value=h3[k];}
      h4.forEach((t,i)=>{const x=ws.getCell(4,i+2);x.value=t;x.alignment={...ctr,textRotation:90};});
      ['A3','P3','Q3'].forEach(k=>ws.getCell(k).fill=fill);
      if(LOGOPNG){const id=wb.addImage({base64:LOGOPNG,extension:'png'});ws.addImage(id,{tl:{col:0.1,row:0.1},ext:{width:56,height:56}});}
      ws.getRow(1).height=44; ws.getRow(2).height=24; ws.getRow(3).height=20; ws.getRow(4).height=92;
      const ss=stu.filter(s=>s.group_code===code).sort((a,b)=>a.serial_no-b.serial_no);
      ss.forEach((s,i)=>{
        const r=5+i, l=L[s.student_code]||{}, g=G[s.student_code]||{};
        const cs=t=>C[s.student_code+'|'+t]||{};
        const clin=t=>{const c=cs(t);const ab=c.absent_all;return [v(c.total_20),v(c.sheet_score_15),ab?'غـ':v(c.att_beh_display)];};
        const labAbs=l.sessions_recorded>0&&l.sessions_attended===0;
        const row=[v(g.total_90),v(l.total_30),v(l.quiz2_10),v(l.quiz1_10),v(l.avg_participation_5),labAbs?'غـ':v(l.avg_attendance_5),
          ...clin('labor'),...clin('postnatal'),...clin('antenatal'),s.full_name,s.serial_no];
        row.forEach((val,j)=>{const x=ws.getCell(r,j+1);x.value=val;x.border=bd;
          x.font={name:j>=15?'Arial':'Calibri',size:j>=15?12:11};
          x.alignment=j===15?{horizontal:'right',vertical:'middle'}:{horizontal:'center',vertical:'middle',wrapText:true};});
        ws.getRow(r).height=17.5;
      });
    }
    const buf=await wb.xlsx.writeBuffer(), a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download=`Nursing_Groups_${(S.f&&S.f.g)||'all'}_${new Date().toISOString().slice(0,10)}.xlsx`; a.click();
  }catch(er){alert('فشل التصدير: '+er.message);}
  if(b){b.disabled=false;b.textContent='تصدير كشف الدرجات (شكل القسم)';}
}

/* ---------- Offline queue, read cache and PWA ---------- */
const IDBP=new Promise((res,rej)=>{const q=indexedDB.open('mt7-offline-v1',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('ops'))d.createObjectStore('ops',{keyPath:'id'});if(!d.objectStoreNames.contains('reads'))d.createObjectStore('reads',{keyPath:'k'});};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const tx=async(m,f)=>{const d=await IDBP;return new Promise((res,rej)=>{const t=d.transaction('ops',m),r=f(t.objectStore('ops'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);});};
const opsAll=()=>tx('readonly',o=>o.getAll()),opPut=x=>tx('readwrite',o=>o.put(x)),opDel=id=>tx('readwrite',o=>o.delete(id));
let syncing=false;
async function queueOp(ctx,table,ex,row,ps,store){
  try{
    const uid=S.me.user_id,old=(await opsAll()).find(o=>o.ctx===ctx&&o.uid===uid&&o.status!=='conflict');
    const r2={...row}; if(ps) delete r2.session_id;
    let op;
    if(old){op={...old,row:{...old.row,...r2},status:'pending',err:null};if(ps&&!op.sessRow)op.sessRow=ps;}
    else op={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),ctx,uid,table,kind:(ex&&ex.id!=null)?'update':'insert',rowId:ex?.id,ver:ex?.version,row:r2,sessRow:ps||null,createdAt:Date.now(),status:'pending'};
    await opPut(op); store({...(ex||{}),...row,_pending:true});
    try{drawStu();}catch(_){} await bar();
    msg('اتحفظ التقييم على الجهاز ولسه ما وصلش للخادم. هيتبعت تلقائيًا لما الإنترنت يرجع.','good');
    if(navigator.onLine) setTimeout(()=>sync(),2500); return true;
  }catch(er){msg('تعذر الحفظ على الجهاز: '+(er.message||er)+' — البيانات ما زالت أمامك','bad');return false;}
}
function adopt(row){try{for(const m of [S.g?.ass||{},S.g?.all||{},S.g?.sheet||{},S.g?.quiz||{}])for(const k in m){const v=m[k];if(v&&v._pending&&v.student_code===row.student_code&&(!row.session_id||!v.session_id||v.session_id===row.session_id)&&(row.quiz_no==null||v.quiz_no===row.quiz_no))m[k]=row;}}catch(_){}}
async function conflict(o,row){
  let q=SB.from(o.table).select('*');
  if(o.rowId!=null)q=q.eq('id',o.rowId);else for(const k of ['student_code','session_id','quiz_no','period_id','training_type_code'])if(row[k]!=null)q=q.eq(k,row[k]);
  const r=await withTO(q.maybeSingle());if(r.error)throw r.error;const sv=r.data;
  if(sv&&Object.keys(o.row).every(k=>String(sv[k]??'')===String(o.row[k]??''))){await opDel(o.id);adopt(sv);return'ok';}
  o.status='conflict';o.server=sv;await opPut(o);return'next';
}
async function syncOne(o){
  try{
    const row={...o.row};
    if(o.sessRow){const sr=o.sessRow,lab=!sr.training_type_code,t=lab?'lab_sessions':'clinical_sessions';let q=SB.from(t).select('*').eq('group_code',sr.group_code).eq('period_id',sr.period_id).eq('session_no',sr.session_no);if(!lab)q=q.eq('training_type_code',sr.training_type_code);
      let r=await withTO(q.maybeSingle());if(r.error)throw r.error;
      if(!r.data){r=await withTO(SB.from(t).insert(sr).select().single());if(r.error){if(/duplicate/i.test(r.error.message)){r=await withTO(q.maybeSingle());if(r.error||!r.data)throw r.error||new Error('تعذر استعادة الجلسة');}else throw r.error;}}
      row.session_id=r.data.id;
    }
    let r;
    if(o.kind==='update'){r=await withTO(SB.from(o.table).update(row).eq('id',o.rowId).eq('version',o.ver).select());if(r.error)throw r.error;if(!r.data.length)return await conflict(o,row);}
    else{r=await withTO(SB.from(o.table).insert(row).select());if(r.error){if(/duplicate/i.test(r.error.message))return await conflict(o,row);throw r.error;}}
    await opDel(o.id);adopt(r.data[0]);return'ok';
  }catch(er){const m=er?.message||String(er);if(isNet(m))return'stop';if(/jwt|expired|not authenticated/i.test(m)){S.auth=true;return'stop';}o.status='error';o.err=tr(m);o.tech=m;await opPut(o);return'next';}
}
async function sync(){if(syncing||!S.me||!navigator.onLine)return;syncing=true;S.auth=false;await bar();try{const ops=(await opsAll()).filter(o=>o.uid===S.me.user_id&&(o.status==='pending'||o.status==='error')).sort((a,b)=>a.createdAt-b.createdAt);let n=0;for(const o of ops){const r=await syncOne(o);if(r==='ok')n++;if(r==='stop')break;}if(n)S.lastSync=new Date();if(n&&S.g){await loadGroup();drawGroup();}}finally{syncing=false;await bar();}}
async function bar(){let b=document.getElementById('syncbar');if(!b){b=document.createElement('div');b.id='syncbar';b.style.cssText='position:fixed;bottom:10px;left:10px;z-index:9999;font:600 12px Cairo,sans-serif;color:#fff;padding:8px 12px;border-radius:12px;cursor:pointer;box-shadow:0 2px 10px #0004;max-width:94vw';b.onclick=syncPanel;document.body.appendChild(b);}if(!S.me){b.style.display='none';return;}b.style.display='block';let all=[];try{all=(await opsAll()).filter(o=>o.uid===S.me.user_id);}catch(_){}const c=k=>all.filter(o=>o.status===k).length,pend=c('pending'),err=c('error'),conf=c('conflict');let t=navigator.onLine?'متصل':'غير متصل';if(syncing)t+=' • جارٍ الإرسال';else if(!all.length)t+=' • لا توجد تقييمات معلقة';else t+=' • '+pend+' بانتظار الإرسال'+(err?' • '+err+' أخطاء':'')+(conf?' • '+conf+' تعارض':'');if(S.auth)t+=' • سجّل الدخول مجددًا';if(S.stale)t+=' • بيانات محفوظة';b.style.background=(conf||err||S.auth)?'#b3261e':(pend||S.stale)?'#c8962b':'#0e7c86';b.textContent=t;}
const TL={clinical_assessments:'حضور وسلوك',clinical_sheet_scores:'درجة الشيت',lab_assessments:'حضور ومشاركة (معمل)',lab_quizzes:'اختبار'};
async function syncPanel(){const all=(await opsAll()).filter(o=>o.uid===S.me?.user_id).sort((a,b)=>a.createdAt-b.createdAt);document.getElementById('sp')?.remove();const kv=r=>Object.entries(r||{}).filter(([k])=>!['session_id','student_code','period_id','training_type_code','quiz_no'].includes(k)).map(([k,v])=>k+'='+(v??'—')).join('، ');const li=all.map(o=>`<div style="border:1px solid #d9e2e1;border-radius:10px;padding:8px;margin:6px 0"><b>${e(TL[o.table]||o.table)}</b> — ${e(o.row.student_code||o.ctx.split('|')[1]||'')}<br><small>${o.status==='pending'?'بانتظار الإرسال':o.status==='error'?'فشل: '+e(o.err||''):'تعارض مع تعديل آخر على الخادم'}</small>`+(o.status==='conflict'?`<br><small>نسختك: ${e(kv(o.row))}<br>الخادم: ${e(kv(o.server))}</small><br><button onclick="resolveOp('${o.id}','mine')">اعتماد نسختي</button> <button onclick="resolveOp('${o.id}','server')">الإبقاء على نسخة الخادم</button>`:'')+'</div>').join('')||'<p>لا توجد عمليات معلقة.</p>';const d=document.createElement('div');d.id='sp';d.style.cssText='position:fixed;inset:0;background:#0007;z-index:10000;display:flex;align-items:center;justify-content:center;padding:12px';d.innerHTML=`<div style="background:#fff;color:#10343f;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:16px;font-family:Cairo,sans-serif"><h3>حالة المزامنة</h3>${li}<button onclick="sync()">إعادة محاولة المزامنة</button> <button onclick="prewarm()">تجهيز البيانات دون إنترنت</button> <button onclick="document.getElementById('sp').remove()">إغلاق</button></div>`;document.body.appendChild(d);}
async function resolveOp(id,w){const o=(await opsAll()).find(x=>x.id===id);if(!o)return;if(w==='server')await opDel(id);else{if(o.server){o.kind='update';o.rowId=o.server.id;o.ver=o.server.version;}else o.kind='insert';o.status='pending';await opPut(o);}await sync();await syncPanel();await bar();}
window.addEventListener('online',()=>{netBar();bar();sync();});window.addEventListener('offline',()=>{netBar();bar();});
setInterval(()=>{if(navigator.onLine)sync();},30000);

/* Cache only authenticated Supabase REST GET responses for offline viewing. */
let rfails=0;
const rtx=async(m,f)=>{const d=await IDBP;return new Promise((res,rej)=>{const t=d.transaction('reads',m),r=f(t.objectStore('reads'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error);});};
const rget=k=>rtx('readonly',o=>o.get(k)),rput=x=>rtx('readwrite',o=>o.put(x)),rclear=()=>rtx('readwrite',o=>o.clear());
function netBar(){let b=document.getElementById('netbar');if(!navigator.onLine){if(!b){b=document.createElement('div');b.id='netbar';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:9999;background:#b3362f;color:#fff;text-align:center;padding:6px;font:600 13px Cairo,sans-serif';b.textContent='أنت غير متصل بالإنترنت — التقييمات الجديدة ستُحفظ على الجهاز وتُرسل عند عودة الاتصال';document.body.appendChild(b);}}else if(b)b.remove();}
async function cfetch(input,init){
  const url=typeof input==='string'?input:input.url,method=((init&&init.method)||(typeof input!=='string'&&input.method)||'GET').toUpperCase();
  if(method!=='GET'||!url.includes('/rest/v1/'))return fetch(input,init);
  const h=new Headers((init&&init.headers)||(typeof input!=='string'?input.headers:{})||{}),key=(S.uid||'')+'|'+(h.get('accept')||'')+'|'+(h.get('prefer')||'')+'|'+url;
  try{const r=await Promise.race([fetch(input,init),new Promise((_,j)=>setTimeout(()=>j(new Error('timeout')),10000))]);if(r.ok){r.clone().text().then(body=>rput({k:key,body,status:r.status,ct:r.headers.get('content-type'),cr:r.headers.get('content-range'),at:Date.now()})).catch(()=>{});if(S.stale){S.stale=null;bar();}}return r;
  }catch(er){rfails++;const c=await rget(key).catch(()=>null);if(c){S.stale=c.at;bar();const hd={'content-type':c.ct||'application/json'};if(c.cr)hd['content-range']=c.cr;return new Response(c.status===204?null:c.body,{status:c.status,headers:hd});}throw er;}
}
async function offUser(){try{const {data:{session}}=await SB.auth.getSession();if(session){S.uid=session.user.id;return session.user;}}catch(_){}if(!navigator.onLine){try{for(const k of Object.keys(localStorage))if(/^sb-.*-auth-token$/.test(k)){const j=JSON.parse(localStorage.getItem(k));const u=j&&(j.user||(j.currentSession&&j.currentSession.user));if(u){S.uid=u.id;return u;}}}catch(_){}}return null;}
async function overlay(){try{if(!S.g||!S.me)return;const lab=S.t==='lab',gc=S.g.gc;for(const o of(await opsAll()).filter(x=>x.uid===S.me.user_id&&x.status!=='conflict')){const r=o.row,code=r.student_code;if(!code||!code.startsWith(gc+'-'))continue;const mk=old=>({...old,...r,_pending:true});if(o.table==='clinical_assessments'||o.table==='lab_assessments'){const sr=o.sessRow,hit=sr?(sr.group_code===gc&&sr.session_no===S.sn&&(lab||sr.training_type_code===S.t)):(S.g.sess&&r.session_id===S.g.sess.id);if(!hit)continue;const x=mk(S.g.ass[code]);S.g.ass[code]=x;if(!lab)S.g.all[code+'|'+S.sn]=x;}else if(o.table==='clinical_sheet_scores'){if(r.training_type_code===S.t||!r.training_type_code)S.g.sheet[code]=mk(S.g.sheet[code]);}else if(o.table==='lab_quizzes')S.g.quiz[code+'|'+r.quiz_no]=mk(S.g.quiz[code+'|'+r.quiz_no]);}}catch(_){}}
loadGroup=(f=>async function(){await f();await overlay();})(loadGroup);
async function prewarm(){
  if(!navigator.onLine||!S.me||!S.period)return alert('يلزم الاتصال بالإنترنت وتجهيز فترة تدريبية مفتوحة أولاً.');
  if(S.me.role!=='doctor')return alert('تجهيز بيانات العمل دون إنترنت متاح لحسابات الدكاترة.');
  const ov=document.createElement('div');ov.style.cssText='position:fixed;inset:0;background:#10343fdd;color:#fff;z-index:10001;display:flex;align-items:center;justify-content:center;font:700 18px Cairo,sans-serif;text-align:center;padding:20px';document.body.appendChild(ov);ov.innerHTML='<div><div id="pwt">جارٍ تجهيز البيانات...</div><div style="font-size:13px;font-weight:400;margin-top:8px">سيتم حفظ بيانات المجموعات التي أُسندت إليك على هذا الجهاز</div><button id="pwk" style="margin-top:14px;color:#10343f">إيقاف التجهيز</button></div>';S.skipPW=false;ov.querySelector('#pwk').onclick=()=>{S.skipPW=true;};
  const keep={g:S.g,t:S.t,sn:S.sn,wk:S.wk},f0=rfails,p=S.period.id,jobs=S.assign.slice();let i=0;
  try{
    await SB.from('roster_students').select('group_code');
    const types=new Set(); for(const a of jobs){if(types.has(a.training_type_code))continue;types.add(a.training_type_code);const t=a.training_type_code,lab=t==='lab';if(lab)await SB.from('v_lab_summary').select('group_code,status').eq('period_id',p);else await SB.from('v_clinical_summary').select('group_code,status').eq('period_id',p).eq('training_type_code',t);}
    for(const a of jobs){if(S.skipPW)break;i++;const pt=ov.querySelector('#pwt');if(pt)pt.textContent='تجهيز المجموعة '+a.group_code+' ('+i+' / '+jobs.length+')';S.t=a.training_type_code;S.g={gc:a.group_code};S.sn=1;await loadGroup();if(a.training_type_code==='lab'){const n=Math.min(S.g.sessions.length+1,20);for(let k=2;k<=n&&!S.skipPW;k++){S.sn=k;await loadGroup();}}}}
  catch(er){rfails++;}
  finally{S.g=keep.g;S.t=keep.t;S.sn=keep.sn;S.wk=keep.wk;ov.remove();}
  if(rfails>f0)alert('قد لا يكتمل التجهيز بسبب ضعف الاتصال. أعد المحاولة وأنت متصل جيدًا.');else{localStorage.setItem('nq_prewarm_'+S.me.user_id,String(Date.now()));alert('انتهى تجهيز البيانات. افتح المجموعات المطلوبة وأنت متصل للتأكد، ثم يمكنك العمل دون إنترنت.');}
  if(!S.g)home();
}
const _lo=logout;logout=async function(){try{const n=(await opsAll()).filter(o=>o.uid===S.me?.user_id).length;if(n&&!confirm('يوجد '+n+' تقييم لم يصل للخادم بعد. ستظل محفوظة على هذا الجهاز، لكن لا تسجّل الخروج إلا إذا كنت تعرف بيانات الدخول. هل تريد الخروج؟'))return;}catch(_){}try{await rclear();}catch(_){}await _lo();await bar();};
if('serviceWorker'in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(_){}
(async()=>{(await offUser())?boot():loginView();netBar();})();
